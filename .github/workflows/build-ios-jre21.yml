# Builds the iOS arm64 Java 21 runtime that the upstream project can no longer
# produce.
#
# ── Why this file is separate and optional ────────────────────────────────────
#
# CraftLauncher ships Java 8 and Java 17, both extracted from the PojavLauncher
# release. That covers Minecraft 1.16.5 and older, plus 1.17 through 1.20.4.
# Minecraft 1.20.5 and newer needs Java 21, and no iOS build of Java 21 is
# publicly downloadable — see docs/JAVA-RUNTIMES.md for the full evidence.
#
# The upstream CI *does* contain the recipe, but its iOS job is pinned to a
# self-hosted runner that no longer exists:
#
#     build_iosport:
#       strategy: { matrix: { version: [17, 21] } }
#       runs-on: MacStadium            # ← their own hardware, long gone
#       continue-on-error: true        # ← so its absence was never noticed
#
# That is why every artifact has expired and the newest development build is
# cancelled. This workflow performs the same build on a GitHub-hosted macOS
# runner instead.
#
# ── How to use it ─────────────────────────────────────────────────────────────
#
#   1. Fork PojavLauncherTeam/android-openjdk-build-multiarch
#   2. Copy this file into the fork at .github/workflows/build-ios-jre21.yml
#   3. In the fork: Settings → Actions → General → enable workflows
#      (GitHub disables them by default on forks of archived repositories)
#   4. Actions → "Build iOS arm64 JRE 21" → Run workflow
#   5. Download the `jre21-ios-aarch64` artifact
#   6. Unpack it into CraftLauncher-iOS/Runtime/java_runtimes/java-21-openjdk/
#   7. Add the java21 tag to RuntimeTag (docs/JAVA-RUNTIMES.md has the exact diff)
#
# ── Expectations ──────────────────────────────────────────────────────────────
#
# A full OpenJDK cross-compile takes 1–3 hours. It may also fail on the first
# attempt: the recipe was last exercised against Xcode 12 and macOS runners have
# moved on considerably. Budget a few iterations, and read the compile log rather
# than assuming the configuration is wrong.

name: Build iOS arm64 JRE 21

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: "JDK major version to build"
        required: false
        default: "21"
      artifact_prefix:
        description: "Artifact name prefix"
        required: false
        default: "jre21"

permissions:
  contents: read

jobs:
  build_ios_jre:
    name: "Build Java ${{ github.event.inputs.target_version || '21' }} for iOS aarch64"
    # Apple Silicon. The build needs a macOS host JDK to bootstrap the target JDK,
    # and an arm64 host avoids Rosetta complications in the toolchain wrappers.
    runs-on: macos-14
    # Generous: a cold OpenJDK build is slow, and a timeout mid-build wastes the
    # whole run.
    timeout-minutes: 300
    # NOT continue-on-error. The upstream job had that set, which is exactly why
    # nobody noticed the runner had disappeared.
    continue-on-error: false

    env:
      TARGET_VERSION: ${{ github.event.inputs.target_version || '21' }}
      BUILD_IOS: "1"

    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "macOS:   $(sw_vers -productVersion)"
          echo "Arch:    $(uname -m)"
          echo "Xcode:   $(xcodebuild -version | head -1)"
          echo "Target:  Java ${TARGET_VERSION}"
          echo
          echo "Available host JDKs:"
          /usr/libexec/java_home -V 2>&1 || true

      # The recipe bootstraps the target JDK with a JDK of the same major version.
      - name: Install host JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ github.event.inputs.target_version || '21' }}
          distribution: temurin

      - name: Resolve JAVA_HOME
        run: |
          export JAVA_HOME="$(/usr/libexec/java_home -v "${TARGET_VERSION}")"
          echo "JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"
          echo "resolved: ${JAVA_HOME}"
          "${JAVA_HOME}/bin/java" -version

      # `1_ci_build_arch_aarch64.sh` is the same entry point the upstream CI uses;
      # `TARGET_VERSION` is what switches it between JDK 17 and 21.
      - name: Build
        run: |
          export PATH=/opt/homebrew/bin:$PATH
          bash "1_ci_build_arch_aarch64.sh"

      - name: Report what was produced
        if: always()
        run: |
          echo "=== build outputs in the workspace ==="
          ls -lh *.tar.xz 2>/dev/null || echo "  no .tar.xz produced"
          echo
          echo "=== dizout ==="
          ls -la dizout 2>/dev/null | head -20 || echo "  no dizout"

      - name: Upload JRE
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_prefix || 'jre21' }}-ios-aarch64
          # `if-no-files-found: error` instead of the upstream's silent upload, so
          # a build that produces nothing fails here rather than handing back an
          # empty artifact.
          path: jre${{ github.event.inputs.target_version || '21' }}*.tar.xz
          if-no-files-found: error
          retention-days: 90

      - name: Upload the full JDK as well
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_prefix || 'jre21' }}-ios-aarch64-fulljdk
          path: jdk${{ github.event.inputs.target_version || '21' }}*.tar.xz
          if-no-files-found: ignore
          retention-days: 90

      # Compile logs are the only way to diagnose a failed cross-compile, and the
      # default log view truncates them.
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/*.log
            config.log
            build/*/config.log
          if-no-files-found: ignore
          retention-days: 14
